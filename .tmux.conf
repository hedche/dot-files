# Managed by mac-dev-playbook (tasks/tmux.yml). Symlinked from ~/dv/dot-files.
#
# Purpose: persist tmux sessions across reboots, including Claude Code
# conversations. Deliberately scoped to persistence only -- ergonomic
# preferences (prefix key, mouse, copy mode) are not set here.

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ---------------------------------------------------------------------------
# resurrect -- what gets saved
# ---------------------------------------------------------------------------
# ~/.tmux/resurrect is the default, but set it explicitly: anything under /tmp
# would be cleared on reboot, defeating the whole point.
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql'

# Claude Code panes are handled by our own hooks rather than @resurrect-processes.
# Process-name matching cannot see Claude: pane_current_command reports the
# version string ("2.1.220"), not "claude". See tmux/resurrect-save-claude.sh.
set -g @resurrect-hook-post-save-all    '~/.tmux/scripts/resurrect-save-claude.sh'
set -g @resurrect-hook-post-restore-all '~/.tmux/scripts/resurrect-restore-claude.sh'

# ---------------------------------------------------------------------------
# continuum -- when it gets saved
# ---------------------------------------------------------------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# @continuum-boot is deliberately NOT set. It opens a GUI terminal window at
# login and only knows Terminal.app/iTerm2/kitty/Alacritty -- not Ghostty.
# Boot is handled headlessly by the uk.leafbit.tmux-server LaunchAgent, which
# runs tmux/boot-tmux.sh.

run '~/.tmux/plugins/tpm/tpm'
